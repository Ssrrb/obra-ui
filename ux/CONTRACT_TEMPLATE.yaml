# UX Contract — copy this file to ux/<surface-id>.yaml and fill it in.
# Required before implementing any significant UI (Principle 7).
# The implementation agent fills everything except `review.approved_by`.

surface:
  id: cost-control                 # stable id used by harness, penpot-map, e2e
  title: Cost Control
  description: One line on what the user does here.
  surface_type: webview-panel      # command | quick-pick | tree-view | editor | status-bar | notification | webview-panel | webview-view

# Principle 1 — justify the surface choice.
surface_choice:
  native_options_considered:
    - surface: tree-view
      rejected_because: needs side-by-side totals and charts, not a hierarchy
    - surface: editor
      rejected_because: no document to edit; this is a control surface
  webview_reason: needs a live-updating summary the user reads, not edits

# Principle 6 — prove reuse before new components.
components:
  reused:
    - "@obra/ui/DataTable"
    - "@obra/ui/Toolbar"
  new: []                          # each entry needs `why_not_existing` below
  new_justification: {}

# Principle 8 — every significant UI defines these states.
states:
  loading: skeleton table + spinner in toolbar
  empty: EmptyState "No costs recorded yet" with primary action
  error: ErrorState with retry; message from host, never a stack trace
  permission_denied: locked panel explaining the missing permission
  extreme_content:
    long_labels: truncate with tooltip at 100% width
    large_dataset: virtualized rows, tested at 1000 rows
    small_dataset: single-row layout verified
    rtl: layout mirrors; icons do not flip meaning
    high_contrast: uses --vscode-contrastBorder, no lost focus ring

keyboard:
  - key: Tab
    behavior: moves through toolbar then table rows
  - key: ArrowDown/ArrowUp
    behavior: moves row selection within the table
  - key: Enter
    behavior: opens the selected row detail
  - key: Escape
    behavior: closes any open menu/dialog, else no-op

data:
  host_messages:
    - { direction: webview->host, type: "cost-control.refresh" }
    - { direction: host->webview, type: "cost-control.data", payload: CostControlData }
  fixtures: [normal, loading, empty, error, slow, largeDataset, permissionDenied]

# Principle 9 — the implementer records; a design reviewer approves.
review:
  implemented_by: agent-name
  visual_baseline_story: Patterns/CostControl
  approved_by:                     # MUST be a design reviewer, not the implementer
  approved_at:
  e2e_flow: scripts/ui/run-flow cost-control
