# UX Contract — cost-control (Phase 9 benchmark workspace).
# Copied from ux/CONTRACT_TEMPLATE.yaml and filled in by the implementation
# agent. `review.approved_by` / `review.approved_at` MUST stay empty until a
# design reviewer accepts (Principle 9). Unverified items are listed under
# `open_gates` and are NOT claimed as satisfied anywhere in this file.

surface:
  id: cost-control                   # stable id: harness ?surface=, .obra-cost-control, e2e flow
  title: Cost Control
  description: >
    Review, filter, and edit project cost lines across projects and sections,
    track budget usage, add new cost items through a validated form, and act
    on a deterministic mocked AI savings suggestion with explicit
    accept/reject confirmation.
  surface_type: webview-panel

# Principle 1 — justify the surface choice (SURFACE_RULES.md order of preference).
surface_choice:
  native_options_considered:
    - surface: command-palette
      rejected_because: >
        commands are single verbs; this workspace needs a persistent grid with
        totals, filters, a detail pane, and multi-step forms — SURFACE_RULES.md
        forbids long-form input in commands.
    - surface: quick-pick
      rejected_because: >
        choose-1-of-N only; cannot show amount/category/status columns, budget
        totals, before/after AI amounts, or editable detail.
    - surface: tree-view
      rejected_because: >
        renders hierarchy, not tabular numeric data; no inline editing, no
        side-by-side totals, no filter result counts.
    - surface: editor
      rejected_because: >
        there is no document artifact; this is a control surface over
        host-owned data, and a custom editor still ends up hosting a webview
        for grid + detail + AI proposal layout.
    - surface: status-bar
      rejected_because: ambient one-click entry only; cannot host anything labeled.
    - surface: notification
      rejected_because: transient; SURFACE_RULES.md forbids data entry in notifications.
    - surface: webview-view
      rejected_because: >
        side panel width cannot hold master-detail with a 1000-row table,
        filters, and an AI proposal with before/after amounts.
  webview_reason: >
    A master-detail workspace: filterable cost grid with currency amounts and
    budget meter beside an editable detail pane, plus an AI proposal that must
    be read (rationale, source items, before/after, budget impact) and
    explicitly confirmed. No native surface composes table + form + live
    totals + confirmation. The webview renders ONLY @obra/ui custom elements
    and --obra-* tokens, and talks to the host only through the typed message
    bridge below (SURFACE_RULES.md webview rules).

# Principle 6 — prove reuse before new components.
components:
  reuse_search: >
    Searched the full @obra/ui export surface (packages/obra-ui/src/index.ts):
    ObraButton, ObraIconButton, ObraTextField, ObraTextArea, ObraCheckbox,
    ObraRadioGroup, ObraSelect/ObraOption, ObraBadge, ObraDivider,
    ObraSpinner, ObraProgress, ObraTabs/ObraTab/ObraTabPanel, ObraTooltip,
    ObraMenu/ObraMenuItem, ObraSectionHeader, ObraEmptyState, ObraErrorState,
    ObraLoadingState, ObraFormField, ObraPropertyRow, ObraToolbar,
    ObraFilterBar, ObraDataTable, ObraMasterDetail, ObraConfirmationDialog,
    ObraStack. Every control in this surface maps to an existing element.
  reused:
    - "@obra/ui/SectionHeader"        # surface title + row-count/benchmark badges
    - "@obra/ui/Badge"                # row count, "Benchmark data" label, mock-AI label
    - "@obra/ui/Toolbar"              # project selector + actions row
    - "@obra/ui/FormField"            # labeled wrappers (project, search, category, status, add/edit fields)
    - "@obra/ui/TextField"            # search, name, amount inputs
    - "@obra/ui/Select"               # project, category, status, add/edit category+status
    - "@obra/ui/Button"               # refresh, add, save, cancel, analyze, accept, reject
    - "@obra/ui/Tabs"                 # section navigation (Line items / Budget summary / AI review)
    - "@obra/ui/DataTable"            # cost grid: states, selection, arrow-key navigation
    - "@obra/ui/MasterDetail"         # grid beside detail pane; collapses when narrow
    - "@obra/ui/PropertyRow"          # read-only detail + summary + proposal rows
    - "@obra/ui/Progress"             # budget meter
    - "@obra/ui/EmptyState"           # empty project vs no filter matches (distinct copy)
    - "@obra/ui/ErrorState"           # error view + retry slot; permission-denied without retry
    - "@obra/ui/LoadingState"        # initial load, project switch, AI pending
    - "@obra/ui/ConfirmationDialog"   # AI accept, discard-pending-edits
    - "@obra/ui/Stack"                # button rows inside forms
  considered_not_used:
    - component: "@obra/ui/FilterBar"
      why_not: >
        Its inner search field carries no accessible name (the label slot is
        not consumed by ObraTextField), which violates the "labeled search"
        requirement. FormField + TextField gives a visible label instead.
        Upstream gap recorded under open_gates; the component was NOT modified.
  new: []                             # no new shared components; none needed
  new_justification: {}
  plain_elements: >
    Only non-interactive semantic/layout elements (main, header, div, p, span,
    h1 and supporting headings) appear outside @obra/ui, styled exclusively with --obra-*
    tokens in src/harness.css (Principles 3–5). No bespoke buttons, inputs, or
    tables.

# Principle 8 — every significant UI defines these states.
# Root element: .obra-cost-control[data-state] (stable selector shared with
# scripts/ui/flows/cost-control.mjs and tests/visual.spec.ts).
states:
  loading: >
    data-state=loading before any host answer: DataTable status=loading,
    status live region "Loading costs…", refresh/add/analyze disabled.
    Reached again on project switch and refresh until the correlated answer
    arrives (slow fixture: 1200 ms delayed data).
  empty: >
    data-state=empty when the host answers with zero rows (empty fixture) or a
    data payload with no rows: "No cost lines recorded for this project yet."
    Distinct from no-filter-matches (below), which keeps data-state=ready.
  no_filter_matches: >
    filters exclude every row of a non-empty project: table empty-message "No
    cost lines match the current filters." + result count "Showing 0 of N" +
    Clear filters action. Never reported as an empty project.
  error: >
    data-state=error with the host's exact message (never a stack trace),
    Retry inside the table error state and refresh in the toolbar, both
    posting cost-control/retry|refresh with a fresh requestId.
  permission_denied: >
    data-state=permission-denied: message + how to obtain access, NO retry
    (retrying cannot grant the missing scope). Read-only projects
    (permissions.canEdit/canAnalyze false in the data payload) keep the
    workspace visible but disable add/edit/analyze and explain why in a text
    banner — restriction is text, never color alone.
  pending_mutations: >
    add-item and edit saves show a pending state (loading button, disabled
    form) until the correlated host answer arrives; failure shows the host
    message and keeps the form values.
  ai_states: >
    idle / pending (loading state + Cancel) / proposal (mock badge, rationale,
    source items, before/after, budget impact, Accept+Reject) / applying
    (pending until correlated data) / error (message + Retry). See ai_behavior.
  extreme_content:
    long_labels: >
      table cells truncate with a title tooltip (DataTable built-in); the
      detail pane shows the FULL value in a wrapping text block
      (longValues fixture).
    large_dataset: 1000 deterministic rows (largeDataset fixture); table scrolls in its own pane.
    small_dataset: single-row browser interaction test passed.
    narrow_layout: >
      MasterDetail collapses to one column below 480px container width;
      filters and toolbar wrap; all table content stays reachable by
      scrolling; full long values remain readable in the detail pane.
    rtl: >
      Primary keyboard interactions were tested with document.dir=rtl under
      forced-colors. Full spatial mirroring and assistive-technology review
      remain pending; basic interaction success does not approve the layout.
    high_contrast: >
      Primary interactions and a visible focus indicator were verified under
      forced-colors. All colors resolve to --obra-* semantic tokens; full
      independent visual/theme approval remains pending.

keyboard:
  - key: Tab
    behavior: >
      moves through toolbar (project select, add, refresh, analyze) → tabs →
      filters → table → detail controls. No positive tabindex anywhere;
      composite widgets (tabs, table rows) use roving tabindex from @obra/ui.
  - key: ArrowLeft/ArrowRight (on tablist)
    behavior: moves between sections (Line items / Budget summary / AI review) and activates.
  - key: ArrowDown/ArrowUp/Home/End (on table)
    behavior: moves row selection (DataTable built-in); detail pane follows selection.
  - key: Enter (on table row)
    behavior: >
      activates the row: posts cost-control/select, moves focus to the detail
      pane (tabindex=-1, programmatic focus only).
  - key: Enter/Space (on any obra-button)
    behavior: activates (Button built-in).
  - key: Escape
    behavior: >
      closes the top-most overlay/action and restores focus to its trigger:
      confirmation dialog (native cancel) → add-item form → pending edit
      (reverts to read-only detail). No other Escape effect.
  - key: typing in search
    behavior: >
      filters on input; the search field keeps focus and caret (only the
      table + result count re-render, never the filter subtree).
  - key: Escape in dialogs
    behavior: ObraConfirmationDialog handles Escape natively (cancel + focus restore).

data:
  correlation: >
    Every mutating webview->host request carries a requestId ("cc-req-N",
    per-session counter). Correlated host answers echo it; answers with a
    stale requestId are ignored (project switch, cancellation, refresh
    races). Uncorrelated messages are accepted only when no data request is
    pending: unsolicited pushes cannot acknowledge saves. Fixtures/manual
    injection remain testable outside an active request.
  host_messages:
    # webview -> host
    - { direction: webview->host, type: "cost-control/ready" }
    - { direction: webview->host, type: "cost-control/refresh", payload: "{requestId, projectId}" }
    - { direction: webview->host, type: "cost-control/retry", payload: "{requestId, projectId}" }
    - { direction: webview->host, type: "cost-control/select-project", payload: "{requestId, projectId}" }
    - { direction: webview->host, type: "cost-control/select", payload: "{id}" }
    - { direction: webview->host, type: "cost-control/add-item", payload: "{requestId, projectId, item:{name,category,status,cost}}" }
    - { direction: webview->host, type: "cost-control/update-item", payload: "{requestId, projectId, id, patch:{name?,category?,status?,cost?}}" }
    - { direction: webview->host, type: "cost-control/analyze", payload: "{requestId, projectId}" }
    - { direction: webview->host, type: "cost-control/cancel-analysis", payload: "{requestId}" }
    - { direction: webview->host, type: "cost-control/apply-analysis", payload: "{requestId, analysisId, projectId}" }
    # host -> webview (optional top-level requestId = correlated answer)
    - { direction: host->webview, type: "cost-control/loading", payload: "{requestId?}" }
    - { direction: host->webview, type: "cost-control/projects", payload: "{projects:[{id,name}], selectedProjectId}" }
    - { direction: host->webview, type: "cost-control/data", payload: "{requestId?, payload:CostControlDataPayload}" }
    - { direction: host->webview, type: "cost-control/empty", payload: "{requestId?, payload:{message}}" }
    - { direction: host->webview, type: "cost-control/error", payload: "{requestId?, payload:{message}}" }
    - { direction: host->webview, type: "cost-control/permission-denied", payload: "{payload:{message}}" }
    - { direction: host->webview, type: "cost-control/analysis", payload: "{requestId, payload:CostAnalysisPayload}" }
    - { direction: host->webview, type: "cost-control/analysis-error", payload: "{requestId, payload:{message}}" }
  persisted_state: >
    setState/getState: {selectedId, projectId?, section?} — Phase 6 shape
    ({selectedId}) still accepted; missing fields fall back to defaults.
  raw_vs_display: >
    Rows keep semantic raw values (cost:number, status, category); currency
    strings are derived only at render time (deterministic formatter, no
    Intl/locale). Stable row ids come from the fixture world.
  fixtures: >
    normal, loading, empty, error, slow, permissionDenied, largeDataset
    (unchanged ids and initial data-states) + multiProject (3-project
    registry), readOnly, oneRow, longValues. normal/multiProject/readOnly/empty/
    error have deterministic createResponder() mock hosts: fixed-latency,
    pure arithmetic, no clock/random/network. empty supports its first row;
    error recovers via Retry. Remaining fixtures support no-response and
    manual-injection tests without automatic responders.

ai_behavior:
  action: >
    "Analyze costs" (toolbar, named, gated by permissions.canAnalyze) posts
    cost-control/analyze with a fresh requestId; the AI review section shows a
    pending state with a Cancel action.
  mock_labeling: >
    Every proposal is visibly labeled "Mocked benchmark output — not real AI"
    (badge + copy). The responder computes it deterministically (highest-cost
    item, after = 85% of before, rounded); no network, no secrets in prompts.
  proposal_content: rationale, source item id(s), before/after amounts, budget impact (used before/after vs total), all as raw numbers + formatted display.
  accept: >
    Accept opens ObraConfirmationDialog (explicit confirmation). Only after
    confirm does the surface post cost-control/apply-analysis; cost data
    changes ONLY when the correlated cost-control/data acknowledgment arrives
    (applying state until then). A correlated error keeps data unchanged and
    shows the error with Retry.
  reject: Reject discards the proposal locally; costs unchanged; no host mutation posted.
  cancel: >
    Cancel during pending posts cost-control/cancel-analysis and invalidates
    the requestId, so a late answer is stale and ignored. Project switches and
    reset likewise invalidate pending analysis.
  stale_responses: >
    analysis/analysis-error/data answers whose requestId does not match the
    active request are ignored (tested by manual injection).
  malformed_messages: >
    Unknown message types and payloads failing the type guards
    (src/surfaces/cost-control/guards.ts) are ignored — never crash, never
    touch financial data.

pending_edit_safety: >
  Row-selection change or project switch while an edit/add form is dirty opens
  a "Discard pending changes?" confirmation dialog: confirm discards and
  proceeds; cancel keeps the edit and restores the previous selection
  (previous row re-selected in the table). Filters never change the selection
  or drop edits — the detail pane follows the selected item even when it is
  filtered out of the table. Escape cancels the edit. Nothing is dropped
  silently.

validation:
  client_side: >
    Add/edit forms validate on submit: name non-empty; amount parses as a
    non-negative decimal (grouping commas allowed, max 2 decimals, finite,
    <= 1e12). Errors render via FormField error attribute (aria-invalid +
    role=alert inside the component) and focus moves to the first invalid
    field. Submit stays enabled until the request starts (better-accessibility
    forms rule).
  server_side: >
    The mock host responder re-validates add/update payloads and answers with
    a correlated cost-control/error on rejection, proving the surface handles
    host-side failure without changing data.
  tests: >
    Authored in apps/ui-harness/tests/: visual.spec.ts (all fixtures,
    data-state + screenshots), vscode-api.spec.ts (bridge contract, Phase 6),
    cost-control.spec.ts (navigation, filters incl. focus/caret preservation,
    selection + keyboard, add/edit validation + save/cancel, discard-pending
    dialog, retry/refresh, permissions, extreme content, AI
    accept/reject/cancel/error/stale/malformed, reset cleanup),
    tests/logic/*.test.ts (pure money/filtering/AI state transitions, run
    under node:test). See README acceptance matrix for authored-vs-executed
    status.

review:
  implemented_by: phase9-worker plus parent completion (implementation agents)
  visual_baseline_story: >
    No Storybook pattern exists for this product surface; component-level
    state references live in @obra/ui-storybook (Primitives/Button,
    Primitives/TextField, Primitives/Select, Primitives/Tabs,
    Patterns/DataTable, Patterns/MasterDetail, Patterns/ConfirmationDialog,
    Patterns states). Harness fixtures are the surface-level baselines.
  approved_by:                        # MUST be a design reviewer, not the implementer — left empty
  approved_at:                        # left empty until review
  e2e_flow: scripts/ui/run-flow cost-control

open_gates:
  # Real, unresolved gates. None of these is claimed as satisfied.
  - id: real-host-flow
    gate: >
      scripts/ui/flows/cost-control.mjs cannot pass: the fork
      (../vscode) has no Obra cost-control command/screen; the flow itself
      fails honestly with "not-implemented" (exit 2). Principle 10 requires
      the workflow to run green in the real Code OSS host before merge.
      PENDING integration of the product extension.
  - id: manual-assistive-technology-review
    gate: >
      Chromium interaction and automated axe checks passed after the owner
      authorized dependency installation. Existing browsers were used with
      no browser download. Manual screen-reader and full zoom/theme review
      remain pending; automated checks do not certify AT behavior.
  - id: visual-baselines
    gate: >
      No screenshot baselines are recorded, and none may be self-approved
      (Principle 9): record with --update-snapshots after execution, then a
      design reviewer approves.
  - id: contract-review
    gate: review.approved_by must be filled by a design reviewer before merge.
  - id: broader-component-review
    gate: >
      Browser-tested integration fixes now cover tab activation/semantics,
      state initialization, native input/select labels and state, FormField
      label focus and descriptions, table selection/grid structure,
      PropertyRow definition-list semantics, and Progress naming.
      Full library review remains separate; unused FilterBar label support
      and the other component stories were not exhaustively audited.
  - id: rtl-high-contrast
    gate: Full RTL mirroring and independent visual/theme approval remain pending despite passing primary-interaction checks.

verification:
  typecheck: Passed for the UI package and complete harness.
  build: Production Vite build passed.
  logic_tests: 24 passing Node tests.
  browser_tests: 19 cost-control workflows and 2 mock-API tests passing in Chromium.
  accessibility: 15 axe WCAG A/AA/2.1 AA cases passed (all fixtures plus forms/summary/AI).
  visuals: Draft fixture captures inspected; not approved regression baselines.
  real_host: Not run; Obra command/webview integration absent.
