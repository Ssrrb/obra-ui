<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Obra UI Harness</title>
  </head>
  <body>
    <!--
      The harness mounts the selected surface into #harness-root and publishes
      test controls on window.__obraHarness.

      URL selection (see README.md):
        ?fixture=<id>   fixture from the registry in fixtures/index.ts
                        (normal, loading, empty, error, slow, permissionDenied,
                        largeDataset, multiProject, readOnly, oneRow,
                        longValues). An unknown id renders a harness error —
                        it never silently falls back to another fixture.
        ?surface=<id>   surface from src/surfaces/index.ts; defaults to the
                        surface the fixture declares.

      Styles come from @obra/ui's generated token layer, imported by src/main.ts.
      This page ships no colour and no spacing value of its own (Principles 4, 5).
    -->
    <div id="harness-root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
